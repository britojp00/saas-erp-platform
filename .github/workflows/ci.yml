name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: saas_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      APP_ENV: test
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/saas_erp_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Alembic check
        working-directory: backend
        run: uv run alembic check

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -q

      - name: Docker build
        run: docker build -t saas-erp-backend ./backend

  build_and_push:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name saaserpplatforma

      - name: Docker build
        run: |
          docker build \
            -t saaserpplatforma-e6gtb8bqbgesdxgr.azurecr.io/saas-erp-backend:${{ github.sha }} \
            ./backend

      - name: Docker push
        run: |
          docker push \
            saaserpplatforma-e6gtb8bqbgesdxgr.azurecr.io/saas-erp-backend:${{ github.sha }}

  deploy:
    needs: build_and_push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy via Azure VM Run Command
        run: |
          set -euo pipefail

          SCRIPT=$(cat <<'REMOTE'
          set -eu

          sudo -u azureuser -H bash -lc '
          set -euo pipefail

          cd /home/azureuser/saas-erp-platform

          git fetch origin master
          git reset --hard origin/master

          az login --identity --output none
          az acr login --name saaserpplatforma

          export BACKEND_IMAGE=saaserpplatforma-e6gtb8bqbgesdxgr.azurecr.io/saas-erp-backend:${{ github.sha }}

          docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend

          docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm --no-deps backend alembic upgrade head

          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps backend

          attempt=1
          while [ "$attempt" -le 30 ]; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              echo ""
              echo "DEPLOY_SUCCESS"
              exit 0
            fi
            echo ""
            echo "Health check attempt $attempt/30 failed"
            sleep 2
            attempt=$((attempt + 1))
          done

          echo "DEPLOY_FAILED: health check exceeded 30 attempts"
          exit 1
          '
          REMOTE
          )

          EXIT_CODE=0
          OUTPUT=$(az vm run-command invoke \
            --resource-group rg-saas-erp-platform \
            --name vm-saas-erp \
            --command-id RunShellScript \
            --scripts "$SCRIPT" \
            --output json) || EXIT_CODE=$?

          echo "$OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "az vm run-command invoke failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

          if ! printf '%s' "$OUTPUT" | grep -q "DEPLOY_SUCCESS"; then
            echo "Deployment failed: DEPLOY_SUCCESS marker not found in remote script output."
            exit 1
          fi

          echo "Deployment completed successfully."

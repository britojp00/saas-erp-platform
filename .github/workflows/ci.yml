name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: saas_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      APP_ENV: test
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/saas_erp_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Alembic check
        working-directory: backend
        run: uv run alembic check

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -q

      - name: Docker build
        run: docker build -t saas-erp-backend ./backend

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to Coolify
        run: |
          echo "Triggering Coolify deploy..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_WEBHOOK }}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy triggered successfully (HTTP $HTTP_STATUS)"
          else
            echo "Deploy failed with HTTP $HTTP_STATUS"
            exit 1
          fi

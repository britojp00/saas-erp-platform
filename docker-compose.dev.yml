name: saas-erp-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: saas-erp-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: saas-erp-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    image: saas-erp-dev-backend:local
    container_name: saas-erp-dev-backend
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      BOOTSTRAP_DEV_EMPRESA_SLUG: ${BOOTSTRAP_DEV_EMPRESA_SLUG}
      BOOTSTRAP_DEV_EMPRESA_NAME: ${BOOTSTRAP_DEV_EMPRESA_NAME:-}
      BOOTSTRAP_DEV_ADMIN_EMAIL: ${BOOTSTRAP_DEV_ADMIN_EMAIL:-}
      BOOTSTRAP_DEV_ADMIN_PASSWORD: ${BOOTSTRAP_DEV_ADMIN_PASSWORD:-}
      BOOTSTRAP_DEV_ADMIN_NAME: ${BOOTSTRAP_DEV_ADMIN_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: saas-erp-dev-frontend:local
    container_name: saas-erp-dev-frontend
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${DEV_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  dev_postgres_data:
  dev_redis_data:
